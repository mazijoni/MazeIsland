name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        shell: bash
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleDebug 2>&1 | tee build.log
          cp app/build/outputs/apk/debug/app-debug.apk MazeIsland.apk

      # Surfaces compiler errors as annotations on the run page.
      - name: Report build errors
        if: failure()
        shell: bash
        run: |
          grep -E "^e: |error:" build.log | head -40 | while IFS= read -r line; do echo "::error::$line"; done

      # Publishes the APK as the "latest" release, so this link always gets the newest build:
      # https://github.com/mazijoni/MazeIsland/releases/latest/download/MazeIsland.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Maze Island build ${{ github.run_number }}
          body: "Automatic build of ${{ github.sha }}. Download MazeIsland.apk below and open it on your phone."
          files: MazeIsland.apk
          make_latest: true
